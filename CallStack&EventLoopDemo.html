<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Call Stack & Event Loop Demo</title>
</head>
<body>
  <button id="demoBtn">Click Me</button>

  <script>
    document.getElementById("demoBtn").addEventListener("click", () => {
      console.log("Start");

      setTimeout(() => {
        console.log("Async Task");
      }, 0);

      console.log("End");
    });
  </script>
</body>
</html>
