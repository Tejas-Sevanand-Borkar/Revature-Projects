<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JSON.parse Demo</title>
</head>
<body>
  <h1>JSON.parse() Example</h1>
  <p id="output"></p>
  <script>
    const response = '{"id":101,"name":"Laptop","price":50000}';
    const obj = JSON.parse(response);
    document.getElementById("output").textContent = "Product Name: " + obj.name;
    console.log(obj.name);
  </script>
</body>
</html>
